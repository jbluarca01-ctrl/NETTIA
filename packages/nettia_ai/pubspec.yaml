name: nettia_ai
description: "Motor de IA de Nettia: proveedores, ajustes, asistente y pantalla de configuración."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  nettia_core:
    path: ../nettia_core
  nettia_knowledge:
    path: ../nettia_knowledge
  ai_core:
    git:
      url: https://github.com/jbluarca01-ctrl/IA_CORE.git
      ref: main
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.5
  simple_icons: ^16.23.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.3.0

flutter:
  assets:
    - assets/openai_logo.webp
