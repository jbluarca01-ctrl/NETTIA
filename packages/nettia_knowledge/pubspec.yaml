name: nettia_knowledge
description: "Base de conocimiento offline de Nettia: corpus curado, índice FTS5 en memoria y búsqueda por perfil."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  nettia_core:
    path: ../nettia_core
  sqlite3: ^3.9.0
  # Desde sqlite3 3.x el .so nativo para Android lo compilan los build hooks
  # del propio paquete sqlite3. sqlite3_flutter_libs (que antes lo aportaba,
  # ver informes/INFORME_INVESTIGACION_NETTIA_CONGELAMIENTOS_IA_2026-09-25.md)
  # quedó en fin de vida (0.6.0+eol) y se retiró el 2026-11-06.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/corpus.json
