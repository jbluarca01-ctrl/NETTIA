# CI de Flutter de Nettia (orden de Jairo 2026-11-06): verifica cada push y
# cada PR (incluidos los de Renovate) con analyze y los tests de la app y de
# cada paquete. Misma versión de Flutter que la PC y que el CI de PRAXIA.
name: Flutter CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    # Windows: las imágenes de referencia (golden) se generan en Windows y en
    # Linux las fuentes se dibujan distinto (2–3 % de píxeles diferentes).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"

      - name: Dependencias del workspace (raíz + packages)
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-pub

      - name: flutter test (raíz)
        run: flutter test --no-pub

      - name: flutter test (packages/*)
        run: |
          for pkg in packages/*/; do
            if [ -d "${pkg}test" ]; then
              echo "=== Tests en $pkg ==="
              (cd "$pkg" && flutter test --no-pub)
            fi
          done
